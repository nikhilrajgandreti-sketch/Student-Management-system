{% extends "base.html" %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
  <section class="card form-card">
    <h2>{{ title }}</h2>

    {% if errors %}
      <ul class="alert alert-error">
        {% for e in errors %}<li>{{ e }}</li>{% endfor %}
      </ul>
    {% endif %}

    <form method="post" action="{{ action }}">
      <label>Name
        <input type="text" name="name" value="{{ student.name or '' }}" required minlength="2" maxlength="100">
      </label>

      <label>Email
        <input type="email" name="email" value="{{ student.email or '' }}" required maxlength="150">
      </label>

      <div class="row">
        <label>Phone
          <input type="text" name="phone" value="{{ student.phone or '' }}" maxlength="20">
        </label>
        <label>Age
          <input type="number" name="age" value="{{ student.age or '' }}" required min="16" max="100">
        </label>
      </div>

      <label>Course
        <input type="text" name="course" value="{{ student.course or '' }}" required minlength="2" maxlength="100">
      </label>

      <div class="form-actions">
        <a class="btn" href="/">Cancel</a>
        <button type="submit" class="btn btn-primary">Save</button>
      </div>
    </form>
  </section>
{% endblock %}
